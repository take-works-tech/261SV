[project]
name = "sim-viewer-engine"
version = "0.0.1"
description = "Reads CAE result files and answers questions about them, without guessing"
requires-python = ">=3.12"

# Pinned, not ranged. The specification states that a rendering path must not change between two
# figures in one report (XC-024), and a floating dependency is exactly how that happens.
dependencies = [
    "vtk==9.5.2",
    "numpy==2.3.4",
]

[project.optional-dependencies]
dev = [
    # Must stay >= 9.0.3: that is the first release carrying the fix for "pytest has vulnerable tmpdir
    # handling" (affects < 9.0.3, moderate), reported by Dependabot on 2026-08-22. The 8.4.2 -> 9.0.3
    # step was a major one and was measured before the pin moved rather than after - the whole suite
    # passed in a clean environment built for the purpose. 9.1.1 arrived as Dependabot #4 and was
    # verified the same way, by CI running the suite against it before the pull request merged.
    # pytest is a development requirement and is not in the distribution closure, so no notice
    # obligation attaches to it (XC-025).
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
