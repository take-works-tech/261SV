name: claude code review
# Automated pull-request review by Claude (anthropics/claude-code-action).
#
# Requires the repository secret CLAUDE_CODE_OAUTH_TOKEN (Pro/Max subscription; issue one with
# `claude setup-token`). For pay-as-you-go instead, replace claude_code_oauth_token with
# `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`. With neither configured this check fails
# rather than passing quietly - a review that did not happen must not report success.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write   # to post review comments
      issues: write          # to post comments
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: 'true'
          # Opus on the first pass, Sonnet on subsequent pushes to the same PR: the first pass is the
          # one that has to find the defect, later ones re-check a diff already characterised.
          claude_args: |
            --model ${{ github.event.action == 'synchronize' && 'sonnet' || 'opus' }}
            --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(python validate/*)"
          prompt: |
            Read and follow .claude/agents/code-reviewer-ci.md. It holds this project's review
            priorities and the defects this repository has actually shipped before.

            Read AGENTS.md and specs/README.md before reviewing. Where general good practice and the
            specification set disagree, the specification is the contract and the disagreement is
            itself a finding.

            Run the gates and report what they say:
              python validate/check_specs.py
              python validate/check_dependency_pins.py
            A specification change and the code it describes must ship in the same pull request.

            Include the evaluated commit SHA (${{ github.event.pull_request.head.sha }}) in your
            comment header.

      # Silent-success guard. The action tightened its default allowedTools during 2026, and a denied
      # `gh` call can leave the SDK finishing with is_error=false having posted nothing - the workflow
      # then reports success for a review nobody received. Read the execution file and fail on either
      # an error result or a run that ended after a single turn (the shape of an auth or quota
      # failure). A green check for a review that did not happen is the worst of the available states.
      - name: Guard against silent success
        if: always() && steps.claude-review.outcome == 'success'
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::warning::execution_file not available; the silent-failure guard could not run."
            exit 0
          fi
          python3 -c '
          import json, os, sys
          with open(os.environ["EXECUTION_FILE"], encoding="utf-8") as handle:
              messages = json.load(handle)
          result = next((m for m in reversed(messages) if isinstance(m, dict) and m.get("type") == "result"), None)
          if result is None:
              print("::warning::no result entry found; guard skipped.")
              sys.exit(0)
          is_error = bool(result.get("is_error"))
          turns = int(result.get("num_turns", 0))
          print(f"is_error={is_error} num_turns={turns}")
          if is_error:
              print("::error::the SDK reported is_error=true. No review was posted.")
              sys.exit(1)
          if turns <= 1:
              print(f"::error::the SDK exited after {turns} turn(s) - the shape of an auth or quota failure.")
              sys.exit(1)
          '
