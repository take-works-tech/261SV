name: ci

# One workflow, because a project with two of them acquires a check that runs in neither. Everything
# that decides whether this repository is in a shippable state runs here, and the branch ruleset names
# these jobs as required.
#
# This replaces the earlier `specs.yml`, which ran the six validators and **never ran the test suite**
# - so `python -m pytest tests` was documented in AGENTS.md as a command and was not covered by
# anything. `check_gates_wired.py` reported green throughout, correctly: it checks that validators are
# invoked, and says nothing about tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Run every gate even when an earlier one fails: the work list is more useful whole than
      # truncated at the first finding, and each of these prints what it could not check.
      - run: python validate/check_specs.py
        if: '!cancelled()'
      - run: python validate/check_boundaries.py
        if: '!cancelled()'
      - run: python validate/check_commands.py
        if: '!cancelled()'
      - run: python validate/check_constant_duplication.py
        if: '!cancelled()'
      - run: python validate/check_context_budget.py
        if: '!cancelled()'
      - run: python validate/check_dependency_pins.py
        if: '!cancelled()'
      - run: python validate/check_object_compatibility.py
        if: '!cancelled()'
      - run: python validate/check_gates_wired.py
        if: '!cancelled()'
      - run: python validate/check_automerge_policy.py
        if: '!cancelled()'

  # XC-219: the review becomes a merge gate on the day the secret exists, and this is what stops that
  # day passing unnoticed. The secret is only visible from inside a workflow, so the check lives here
  # rather than in `validate/` - and it is deliberately loud: once the secret is set, every run is red
  # until the two triggers are restored, which is a two-line change with the lines already written in
  # the file, commented, where they belong.
  merge-wiring:
    name: the wiring the merge depends on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - name: The review runs on pull requests exactly when it can authenticate
        env:
          SECRET_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/claude-code-review.yml
          if grep -qE '^\s{2}pull_request:' "$workflow"; then triggered=true; else triggered=false; fi
          echo "secret present: $SECRET_PRESENT / triggered by pull_request: $triggered"
          if [ "$SECRET_PRESENT" = "true" ] && [ "$triggered" = "false" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is set, so the review can run - restore the commented pull_request trigger in $workflow and mark XC-188 superseded (XC-219)."
            exit 1
          fi
          if [ "$SECRET_PRESENT" = "false" ] && [ "$triggered" = "true" ]; then
            echo "::error::$workflow runs on pull requests with no token to authenticate with, so every pull request would be red for a reason unrelated to it (XC-188)."
            exit 1
          fi
          echo "The review's wiring and its credential agree."

      # XC-218's brake is a label read by exact name. A label that does not exist cannot be applied,
      # and the moment you need it is not the moment to discover that. Found by looking: the repository
      # had only GitHub's nine defaults, so `no-auto-merge` - and the four names dependabot.yml uses -
      # existed nowhere.
      - name: The labels the automation names actually exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh label list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name')
          missing=""
          for label in no-auto-merge dependencies needs-spec-change mockups ci; do
            echo "$existing" | grep -qx "$label" || missing="$missing $label"
          done
          if [ -n "$missing" ]; then
            echo "::error::labels named by the automation and absent from the repository:$missing"
            exit 1
          fi
          echo "Every label the automation names exists."

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # The engine's dependencies are installed rather than mocked, because the tests that matter most
      # here assert what VTK actually does - that it fills unsampled points with zero (INV-011), that
      # it copies cell values into points (INV-012). A stub would assert what we believe it does.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # SIM_VIEWER_REQUIRE_VTK turns the local "VTK is not installed, skipping" into a failure. A skip
      # is a reasonable answer on a laptop and never a reasonable answer here, and a suite that is
      # allowed to skip in CI reports success for tests that did not run.
      - run: python -m pytest tests -q
        env:
          SIM_VIEWER_REQUIRE_VTK: "1"

  mockups:
    name: mockup catalogue typecheck and render
    runs-on: ubuntu-latest
    # The catalogue is design states, never shipped code - but it is executable, and a reference to a
    # component that does not exist is how a screen state silently stops being demonstrable.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mockups/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: mockups/ui
      - run: npm run typecheck
        working-directory: mockups/ui
      # XC-218: a typecheck catches a reference to a component that does not exist and catches nothing
      # about a state that throws while rendering. That gap was covered by a person sweeping the
      # catalogue before every push; once a workflow may merge on CI's word, CI has to do the sweep.
      - run: npm run build
        working-directory: mockups/ui
      - name: serve the built catalogue
        run: npm run start -- --port 3000 &
        working-directory: mockups/ui
      - name: wait for it
        run: for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && exit 0; sleep 2; done; echo "the mockup did not start"; exit 1
      - run: python validate/check_mockup_states.py
        env:
          MOCKUP_BASE_URL: http://localhost:3000
